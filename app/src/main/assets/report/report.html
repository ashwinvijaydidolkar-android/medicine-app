<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragini report</title>
<style>
@font-face { font-family: "Young Serif"; font-weight: 400; src: url(fonts/young-serif-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Lexend"; font-weight: 400; src: url(fonts/lexend-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Lexend"; font-weight: 500; src: url(fonts/lexend-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Lexend"; font-weight: 600; src: url(fonts/lexend-latin-600-normal.woff2) format("woff2"); }
html, body { margin: 0; padding: 0; background: transparent; }
.rp { padding-bottom: 8px !important; }
</style>
</head>
<body>
<div id="root"></div>
<script src="report.js"></script>
<script>
/* The Android app calls show(); "Host" is the app's bridge that receives the page height. */
let R = null;
function show(data, mode, dark) {
  R = data;
  document.getElementById('root').innerHTML = RaginiReport.html(data, mode, { dark: !!dark });
  if (mode === 'print') document.body.style.background = '#fff';
  const tell = () => { if (window.Host) Host.height(Math.ceil(document.documentElement.scrollHeight)); };
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(tell));
  tell();
}
function csv() { return RaginiReport.csv(R); }
function text() { return RaginiReport.text(R); }
</script>
</body>
</html>
