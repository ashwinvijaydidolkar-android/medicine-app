name: Build Ragini APK

# Runs on every push, and can be started by hand from the Actions tab ("Run workflow").
# Each successful build is published under Releases as Ragini-MedicineReminder.apk.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    # Ubuntu 24.04 images come with the Android SDK already installed (ANDROID_HOME).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tee sdk.log
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build installable APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Ragini-MedicineReminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ragini-MedicineReminder-APK
          path: Ragini-MedicineReminder.apk

      - name: Publish the APK under Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ragini APK (build ${{ github.run_number }})
          body: Install Ragini-MedicineReminder.apk on the phone. Allow "Install unknown apps" when Android asks.
          files: Ragini-MedicineReminder.apk
          make_latest: true

      - name: Publish the build log if something went wrong
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Build log ${{ github.run_number }} (failed)
          prerelease: true
          files: |
            build.log
            sdk.log
          fail_on_unmatched_files: false
