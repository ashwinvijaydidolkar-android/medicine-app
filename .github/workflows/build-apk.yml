name: Build Ragini APK

# Runs on every push, and can be started by hand from the Actions tab ("Run workflow").
on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Ragini-MedicineReminder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ragini-MedicineReminder-APK
          path: Ragini-MedicineReminder.apk
